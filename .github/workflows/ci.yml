# Runs the tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Go (vet + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "run gofmt -w ." && exit 1)
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build

  evaluator:
    name: Python evaluator (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evaluator/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
